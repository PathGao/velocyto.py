name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install .
      # run outside the checkout: the source tree `velocyto/` has no compiled
      # speedboosted extension and would shadow the installed package
      - run: python -c "import velocyto; print(velocyto.__version__)"
        working-directory: ${{ runner.temp }}
      - run: pip install pytest
      - run: pytest "$GITHUB_WORKSPACE/tests"
        working-directory: ${{ runner.temp }}
